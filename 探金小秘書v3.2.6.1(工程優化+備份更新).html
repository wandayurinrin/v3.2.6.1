                                      <th className="px-0.5 py-1.5 w-[8%] text-center">人數</th>
                                      <th className="px-1 py-1.5 w-[14%] text-right">人工費</th>
                                      <th className="px-1 py-1.5 w-[14%] text-right">其他</th>
                                      <th className="px-1 py-1.5 w-[16%] text-right">總額</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                    {proj.records.map(r => {
                                      const pCount = (r.personnel || []).length;
                                      
                                      let laborSum = 0;
                                      (r.personnel || []).filter(p => p.billable).forEach(p => { laborSum += (Number(p.dailyRate) || 0); });
                                      (r.personnelExtras || []).filter(pe => pe.billable).forEach(pe => { laborSum += (Number(pe.amount) || 0); });
                                      const tasks = Array.isArray(r.workSections) ? r.workSections.flatMap(s => s.tasks) : (r.tasks || []);
                                      tasks.filter(t => t.billable).forEach(t => { laborSum += (Number(t.billingAmount) || 0); });

                                      let taskOther = 0;
                                      tasks.filter(t => t.billable).forEach(t => { taskOther += (Number(t.otherCost) || 0); });

                                      const workSummaryText = r.workSummary || (Array.isArray(r.workSections) ? r.workSections.map(s => s.summary).filter(Boolean).join('； ') : '') || r.remarks || proj.projectName;

                                      return (
                                        <tr key={r.id} className="hover:bg-slate-50">
                                          <td className="px-1 py-1 font-mono text-slate-500 truncate">{r.date}</td>
                                          <td className="px-1 py-1 font-semibold text-slate-800 truncate" title={workSummaryText}>{workSummaryText}</td>
                                          <td className="px-0.5 py-1 text-center truncate">{pCount}</td>
                                          <td className="px-1 py-1 text-right truncate">${laborSum.toLocaleString()}</td>
                                          <td className="px-1 py-1 text-right truncate">${taskOther.toLocaleString()}</td>
                                          <td className="px-1 py-1 text-right font-extrabold text-blue-600 truncate">${(r.summary?.totalBilling || 0).toLocaleString()}</td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            </div>

                            {(() => {
                              const materials = [];
                              proj.records.forEach(r => {
                                (r.customItems || []).filter(c => c.billable).forEach(c => {
                                  materials.push({ 
                                    id: c.id || Math.random(), 
                                    date: r.date, 
                                    name: c.name, 
                                    qty: c.qty || 1, 
                                    price: c.price || 0, 
                                    total: (Number(c.qty)||0) * (Number(c.price)||0) 
                                  });
                                });
                              });
                              return (
                                <div className="bg-white rounded-lg border border-slate-200 p-2 space-y-1.5">
                                  <h5 className="text-[11px] font-bold text-slate-700 border-b pb-1">購買物品明細</h5>
                                  <div className="w-full">
                                    <table className="w-full table-fixed text-left border-collapse text-[9px] sm:text-[10px] bg-white whitespace-nowrap">
                                      <thead>
                                        <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                          <th className="px-1 py-1.5 w-[20%] text-left">日期</th>
                                          <th className="px-1 py-1.5 w-[36%] text-left">名稱</th>
                                          <th className="px-0.5 py-1.5 w-[10%] text-center">數量</th>
                                          <th className="px-1 py-1.5 w-[16%] text-right">單價</th>
                                          <th className="px-1 py-1.5 w-[18%] text-right">總額</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-slate-100">
                                        {materials.map((m, idx) => (
                                          <tr key={idx} className="hover:bg-slate-50">
                                            <td className="px-1 py-1 font-mono text-slate-500 truncate">{m.date}</td>
                                            <td className="px-1 py-1 font-semibold text-slate-800 truncate" title={m.name}>{m.name}</td>
                                            <td className="px-0.5 py-1 text-center truncate">{m.qty}</td>
                                            <td className="px-1 py-1 text-right truncate">${m.price.toLocaleString()}</td>
                                            <td className="px-1 py-1 text-right font-bold text-slate-900 truncate">${m.total.toLocaleString()}</td>
                                          </tr>
                                        ))}
                                        {materials.length === 0 && (
                                          <tr><td colSpan="5" className="text-center py-2 text-slate-400">無請款物品明細</td></tr>
                                        )}
                                      </tbody>
                                    </table>
                                  </div>
                                </div>
                              );
                            })()}

                            {(() => {
                              const expenseItems = [];
                              proj.records.forEach(r => {
                                const labels = { fuel: '加油錢', food: '餐費', drink: '飲料' };
                                ['fuel', 'food', 'drink'].forEach(k => {
                                  if (r.costs?.[k]?.billable) {
                                    expenseItems.push({
                                      date: r.date,
                                      item: labels[k],
                                      total: Number(r.costs[k].billingAmount) || 0
                                    });
                                  }
                                });
                                (r.costs?.customCosts || []).filter(cc => cc.billable).forEach(cc => {
                                  expenseItems.push({
                                    date: r.date,
                                    item: cc.name || '其他費用',
                                    total: Number(cc.billingAmount) || 0
                                  });
                                });
                              });

                              return (
                                <div className="bg-white rounded-lg border border-slate-200 p-2 space-y-1.5">
                                  <h5 className="text-[11px] font-bold text-slate-700 border-b pb-1">其他費用支出</h5>
                                  <div className="w-full">
                                    <table className="w-full table-fixed text-left border-collapse text-[9px] sm:text-[10px] bg-white whitespace-nowrap">
                                      <thead>
                                        <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                          <th className="px-1 py-1.5 w-[22%] text-left">日期</th>
                                          <th className="px-1 py-1.5 w-[48%] text-left">項目</th>
                                          <th className="px-1 py-1.5 w-[30%] text-right">總額</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-slate-100">
                                        {expenseItems.map((exp, idx) => (
                                          <tr key={idx} className="hover:bg-slate-50">
                                            <td className="px-1 py-1 font-mono text-slate-500 truncate">{exp.date}</td>
                                            <td className="px-1 py-1 font-semibold text-slate-800 truncate" title={exp.item}>{exp.item}</td>
                                            <td className="px-1 py-1 text-right font-bold text-slate-900 truncate">${exp.total.toLocaleString()}</td>
                                          </tr>
                                        ))}
                                        {expenseItems.length === 0 && (
                                          <tr><td colSpan="3" className="text-center py-2 text-slate-400">無請款其他費用</td></tr>
                                        )}
                                      </tbody>
                                    </table>
                                  </div>
                                </div>
                              );
                            })()}

                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="text-right border-t-2 border-slate-800 pt-3 mt-4 flex justify-between items-center gap-2">
                    <button 
                      onClick={() => {
                        const uncollectedRecords = clientRecords.filter(r => {
                            const pName = r.projectName || '未命名工程';
                            const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
                            const projectGroup = groupedByProject.find(g => 
                                (selectedClient === '全部' ? `[${g.client}] ${g.projectName}` : g.projectName) === clientKey
                            );
                            return !projectGroup || !projectGroup.isCollected;
                        });
                        
                        if (uncollectedRecords.length === 0) {
                            showToast('所有項目均已收款，無未收款項目可產生報表。');
                            return;
                        }

                        let finalTotalLabor = 0;
                        let finalTotalMaterial = 0;
                        let finalTotalExpenses = 0;
                        let finalGrandTotal = 0;

                        uncollectedRecords.forEach(r => {
                             let l = 0;
                             (r.personnel || []).filter(p => p.billable).forEach(p => { l += (Number(p.dailyRate)||0); });
                             (r.personnelExtras || []).filter(pe => pe.billable).forEach(pe => { l += (Number(pe.amount)||0); });
                             const tasks = Array.isArray(r.workSections) ? r.workSections.flatMap(s => s.tasks) : (r.tasks || []);
                             tasks.filter(t => t.billable).forEach(t => { l += Number(t.billingAmount)||0; });
                             finalTotalLabor += l;

                             let m = 0;
                             (r.customItems || []).filter(c => c.billable).forEach(c => { m += (Number(c.qty)||0)*(Number(c.price)||0); });
                             finalTotalMaterial += m;

                             let e = 0;
                             ['fuel', 'food', 'drink'].forEach(k => { 
                               if (r.costs?.[k]?.billable) e += Number(r.costs[k].billingAmount) || 0; 
                             });
                             (r.costs?.customCosts || []).filter(cc => cc.billable).forEach(cc => {
                               e += Number(cc.billingAmount) || 0;
                             });
                             finalTotalExpenses += e;

                             finalGrandTotal += (r.summary?.totalBilling || 0);

                      className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold cursor-pointer shadow-sm flex items-center gap-1 shrink-0 whitespace-nowrap print:hidden"

              {groupedByProject.length === 0 && (

        function SalaryView({ records, settings, setOfficialSalaryModal, showToast }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedEmployee, setSelectedEmployee] = useState('全部');
          const [expandedEmployees, setExpandedEmployees] = useState({});

          const toggleExpand = (name) => {
             setExpandedEmployees(prev => ({ ...prev, [name]: !prev[name] }));
          };

          const allEmployeeNames = useMemo(() => {
            const setNames = new Set();
            records.forEach(r => {
              if (r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth)) {
                (r.personnel || []).forEach(p => { if (p.name) setNames.add(p.name); });
              }
            });
            return ['全部', ...Array.from(setNames)];
          }, [records, selectedMonth]);

          useEffect(() => {
            if (!allEmployeeNames.includes(selectedEmployee)) setSelectedEmployee('全部');
          }, [allEmployeeNames, selectedEmployee]);

          const salaryData = useMemo(() => {
            const monthRecords = records.filter(r => r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth));
            const employeeMap = {};

            monthRecords.forEach(r => {
              (r.personnel || []).forEach(p => {
                const name = p.name || '未具名';
                if (selectedEmployee !== '全部' && name !== selectedEmployee) return;

                if (!employeeMap[name]) {
                  employeeMap[name] = {
                    name, month: selectedMonth, totalDays: 0, totalSalary: 0, baseSalary: 0, overtimeTotal: 0, bonusTotal: 0, otherTotal: 0,
                    workDetails: [], otBonusDetails: [], otherDetails: []
                  };
                }
                const dayValue = p.dayType === 'half' ? 0.5 : 1.0;
                const dailyPay = Number(p.dailyRate) || 0;

                employeeMap[name].totalDays += dayValue;
                employeeMap[name].baseSalary += dailyPay;
                employeeMap[name].totalSalary += dailyPay;
                employeeMap[name].workDetails.push({
                  date: r.date, projectName: r.projectName, dayType: p.dayType === 'half' ? '半日' : p.dayType === 'outsource' ? '發包' : '全日', dailyRate: dailyPay
                });
              });

              (r.personnelExtras || []).forEach(pe => {
                 const name = pe.name || '未具名';
                 if (selectedEmployee !== '全部' && name !== selectedEmployee) return;
                 if (!employeeMap[name]) {
                    employeeMap[name] = {
                      name, month: selectedMonth, totalDays: 0, totalSalary: 0, baseSalary: 0, overtimeTotal: 0, bonusTotal: 0, otherTotal: 0,
                      workDetails: [], otBonusDetails: [], otherDetails: []
                    };
                 }

                 const amount = Number(pe.amount) || 0;
                 employeeMap[name].totalSalary += amount;

                 if (pe.type === '加班費' || pe.type === '獎金' || pe.type === '加班' || pe.type === '獎金(舊)') {
                     if (pe.type.includes('加班')) employeeMap[name].overtimeTotal += amount;
                     if (pe.type.includes('獎金')) employeeMap[name].bonusTotal += amount;
                     employeeMap[name].otBonusDetails.push({ date: r.date, projectName: r.projectName, type: pe.type, amount });
                 } else {
                     employeeMap[name].otherTotal += amount;
                     employeeMap[name].otherDetails.push({ date: r.date, projectName: r.projectName, type: pe.type, amount });
                 }
              });
            });

            const orderMap = {};
            settings.fixedPersonnel.forEach((fp, idx) => { orderMap[fp.name] = idx; });

            const unsortedData = Object.values(employeeMap);
            return unsortedData.sort((a, b) => {
              const idxA = orderMap[a.name] !== undefined ? orderMap[a.name] : 999;
              const idxB = orderMap[b.name] !== undefined ? orderMap[b.name] : 999;
              return idxA - idxB;
            });
          }, [records, selectedMonth, selectedEmployee, settings.fixedPersonnel]);

          const month = parseInt(monthStr);
          const firstDayIndex = new Date(year, month - 1, 1).getDay();
          const daysInMonth = new Date(year, month, 0).getDate();

          const activeDates = new Set(filteredRecords.filter(r => r.type !== 'holiday').map(r => r.date));
          const holidayDates = new Set(filteredRecords.filter(r => r.type === 'holiday').map(r => r.date));

             if (selectedCalendarDate) {

        function StatsView({ records }) {
          const [selectedCategory, setSelectedCategory] = useState('all');

          const validRecords = useMemo(() => {
            return records.filter(r => r.type !== 'quotation' && r.type !== 'holiday');
          }, [records]);

          const calcStats = (list) => {
            let totalBilling = 0;
            let totalCost = 0;
            let laborCost = 0;
            let materialCost = 0;
            let otherCost = 0;

            list.forEach(r => {
              totalBilling += (r.summary?.totalBilling || 0);

              let rLabor = 0;
              (r.personnel || []).forEach(p => { rLabor += Number(p.dailyRate) || 0; });
              (r.personnelExtras || []).forEach(pe => { rLabor += Number(pe.amount) || 0; });
              const tasks = Array.isArray(r.workSections) ? r.workSections.flatMap(s => s.tasks) : (r.tasks || []);
              tasks.forEach(t => { rLabor += Number(t.laborCost) || 0; });

              let rMat = 0;
              (r.customItems || []).forEach(c => { rMat += (Number(c.qty) || 0) * (Number(c.price) || 0); });
              tasks.forEach(t => { rMat += Number(t.otherCost || t.materialCost) || 0; });

              let rOther = (Number(r.costs?.fuel?.cost) || 0) +
                           (Number(r.costs?.food?.cost) || 0) +
                           (Number(r.costs?.drink?.cost) || 0);
              (r.costs?.customCosts || []).forEach(cc => { rOther += Number(cc.cost) || 0; });

              laborCost += rLabor;
              materialCost += rMat;
              otherCost += rOther;

              const rTotalCost = r.summary?.totalCost !== undefined ? r.summary.totalCost : (rLabor + rMat + rOther);
              totalCost += rTotalCost;
            });

            const profit = totalBilling - totalCost;
            const margin = totalBilling > 0 ? ((profit / totalBilling) * 100).toFixed(1) : '0.0';

            return {
              count: list.length,
              totalBilling,
              totalCost,
              profit,
              margin,
              laborCost,
              materialCost,
              otherCost
            };
          };

          const allStats = useMemo(() => calcStats(validRecords), [validRecords]);
          const contractStats = useMemo(() => calcStats(validRecords.filter(r => r.type === 'contract')), [validRecords]);
          const hourlyStats = useMemo(() => calcStats(validRecords.filter(r => r.type === 'hourly')), [validRecords]);

          const categories = [
            { id: 'all', label: '全部工程', data: allStats, icon: '📊' },
            { id: 'contract', label: '發包工程', data: contractStats, icon: '📦' },
            { id: 'hourly', label: '計工時工程', data: hourlyStats, icon: '⏱️' }

            const { label, data, icon } = cat;
            const laborPct = data.totalCost > 0 ? ((data.laborCost / data.totalCost) * 100).toFixed(1) : '0.0';
            const matPct = data.totalCost > 0 ? ((data.materialCost / data.totalCost) * 100).toFixed(1) : '0.0';
            const otherPct = data.totalCost > 0 ? ((data.otherCost / data.totalCost) * 100).toFixed(1) : '0.0';

            return (
              <Card key={cat.id} className="border border-slate-200 shadow-2xs">
                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">

                <div className="grid grid-cols-3 gap-2 mb-3.5 text-center">
                  <div className="bg-blue-50/80 p-2 rounded-lg border border-blue-100">
                    <span className="text-[10px] font-bold text-blue-600 block mb-0.5">總請款</span>

                    <span className="text-[10px] font-bold text-rose-600 block mb-0.5">總成本</span>

                    <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
                      <span className="text-slate-500 block font-bold mb-0.5">📦 材料費用</span>
                      <span className="font-extrabold text-slate-800 text-xs block">${data.materialCost.toLocaleString()}</span>
                      <span className="text-[9px] text-slate-400 block mt-0.5">{matPct}%</span>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
                      <span className="text-slate-500 block font-bold mb-0.5">⛽ 其他費用</span>

                      <div style={{ width: `${matPct}%` }} className="bg-emerald-500 h-full" title={`材料 ${matPct}%`} />
                      <div style={{ width: `${otherPct}%` }} className="bg-amber-500 h-full" title={`其他 ${otherPct}%`} />
                    </div>
                  )}
                </div>
              </Card>
            );
          };

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="bg-white p-1 rounded-xl border border-slate-200 shadow-2xs flex gap-1 text-xs font-bold">

                <button

                <button
                  onClick={() => setSelectedCategory('hourly')}
                  className={`flex-1 py-1.5 rounded-lg transition-colors cursor-pointer ${selectedCategory === 'hourly' ? 'bg-emerald-600 text-white shadow-2xs' : 'text-slate-500 hover:text-slate-800'}`}

        function SettingsView({ settings, onSave, records, setRecords, showToast }) {
          const [form, setForm] = useState(settings);
          const [newName, setNewName] = useState('');
          const [newFullRate, setNewFullRate] = useState(2500);
          const [newHalfRate, setNewHalfRate] = useState(1300);
          const [importText, setImportText] = useState('');
          const [showBackupModal, setShowBackupModal] = useState(false);
          const [backupJsonText, setBackupJsonText] = useState('');

          const handleFieldChange = (field, val) => setForm(prev => ({ ...prev, [field]: val }));

          const updatePersonRate = (index, field, rate) => {
            const updatedPersonnel = [...form.fixedPersonnel];
            updatedPersonnel[index] = { ...updatedPersonnel[index], [field]: Number(rate) || 0 };
            const updated = { ...form, fixedPersonnel: updatedPersonnel };
            setForm(updated);
            onSave(updated);
          };

          const addPerson = (e) => {
            e.preventDefault();
            if (!newName.trim()) return;
            const updated = { 
              ...form, 
              fixedPersonnel: [...form.fixedPersonnel, { name: newName.trim(), fullDayRate: Number(newFullRate) || 2500, halfDayRate: Number(newHalfRate) || 1300 }] 
            };
            setForm(updated);
            onSave(updated);
            setNewName('');
            setNewFullRate(2500);
            setNewHalfRate(1300);
          };

          const removePerson = (name) => {
            const updated = { ...form, fixedPersonnel: form.fixedPersonnel.filter(p => p.name !== name) };
            setForm(updated);
            onSave(updated);
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            onSave(form);
          };

          const exportDataText = async () => {
            const jsonStr = JSON.stringify({ records, settings });
            const success = await copyToClipboard(jsonStr);
            if (success) {
              showToast('備份代碼已成功複製！可貼到 LINE 或備忘錄保存');
            } else {
              setBackupJsonText(jsonStr);
              setShowBackupModal(true);
            }
          };

          // 專為 WebIntoApp / Mobile WebView 優化的備份下載機制
          const exportDataFile = async () => {
            try {
              const jsonStr = JSON.stringify({ records, settings }, null, 2);
              const fileName = `探金小秘書_備份_${new Date().toISOString().slice(0, 10)}.json`;
              const blob = new Blob([jsonStr], { type: 'application/json' });
              
              // 優先試用 Web Share API（手機 WebView / App 支援度最高，免下載權限）
              if (navigator.canShare) {
                const file = new File([blob], fileName, { type: 'application/json' });
                if (navigator.canShare({ files: [file] })) {
                  try {
                    await navigator.share({
                      files: [file],
                      title: '探金小秘書 備份檔案',
                      text: '探金小秘書資料備份 JSON'
                    });
                    showToast('已成功分享/儲存備份檔案！');
                    return;
                  } catch (shareErr) {
                    if (shareErr.name === 'AbortError') return; // 使用者主動取消
                  }
                }
              }

              // 次要相容模式 1：傳統 Blob URL 觸發下載
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              showToast('備份檔案已請求下載！');

            } catch (err) {
              console.warn('自動下載受限，開啟備份代碼顯示彈窗...', err);
              // 保底機制：若 App WebView 攔截任何下載動作，顯示備份代碼彈窗
              setBackupJsonText(JSON.stringify({ records, settings }));
              setShowBackupModal(true);
            }
          };

          const processImportData = (parsed) => {
            if (parsed.records) setRecords(parsed.records);
            if (parsed.settings) {
              if (parsed.settings.fixedPersonnel && typeof parsed.settings.fixedPersonnel[0] === 'string') {
                parsed.settings.fixedPersonnel = parsed.settings.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
              }
              setForm(parsed.settings);
              onSave(parsed.settings);
            }
            showToast('資料還原成功！');
          };

          const importDataText = () => {
            if (!importText.trim()) {
              alert('請先貼上備份代碼文字');
              return;
            }
            try {
              const parsed = JSON.parse(importText.trim());
              processImportData(parsed);
              setImportText('');
            } catch (err) {
              alert('備份代碼格式錯誤，請確認是否完整複製');
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const parsed = JSON.parse(evt.target.result);
                processImportData(parsed);
              } catch (err) {
                alert('備份檔案解析失敗，請確認檔案格式是否正確。');
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          };

          return (
            <div className="space-y-4 max-w-2xl mx-auto">
              {showBackupModal && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center z-[90] p-3">
                  <div className="bg-white rounded-xl shadow-2xl p-4 w-full max-w-lg border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h3 className="font-extrabold text-sm text-slate-900">📦 備份資料檢視 (App 備用)</h3>
                      <button onClick={() => setShowBackupModal(false)} className="text-slate-400 hover:text-slate-600 font-bold px-1.5">✕</button>
                    </div>
                    <p className="text-[11px] text-slate-500 leading-relaxed">
                      若您的 App 阻擋了檔案下載，請點擊下方「全選並複製代碼」，貼至手機備忘錄或 LINE 保存。
                    </p>
                    <textarea 
                      readOnly 
                      value={backupJsonText} 
                      onClick={(e) => e.target.select()}
                      className="w-full h-44 p-2 text-[10px] font-mono bg-slate-50 border border-slate-200 rounded-lg outline-none select-all"
                    />
                    <div className="flex gap-2 pt-1">
                      <button 
                        onClick={async () => {
                          const ok = await copyToClipboard(backupJsonText);
                          if (ok) showToast('已成功全選複製備份文字！');
                          else alert('複製失敗，請手動長按輸入框選擇全選');
                        }}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-xs font-bold cursor-pointer"
                      >
                        📋 複製全部文字
                      </button>
                      <button onClick={() => setShowBackupModal(false)} className="px-4 bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-semibold cursor-pointer">
                        關閉
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <Card title="公司/工作室抬頭設定 (用於請款單)">
                <form onSubmit={handleSaveSettings} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">公司名稱</label>
                      <input type="text" value={form.companyName || ''} onChange={e => handleFieldChange('companyName', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：順發工程行" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">統一編號</label>
                      <input type="text" value={form.taxId || ''} onChange={e => handleFieldChange('taxId', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：12345678" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">聯絡電話</label>
                      <input type="text" value={form.phone || ''} onChange={e => handleFieldChange('phone', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：0912-345678" />
                    </div>
                  </div>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">儲存基本設定</button>
                </form>
              </Card>

              <Card title="固定班底與薪資管理">
                <div className="space-y-2.5 mb-4">
                  {form.fixedPersonnel.map((fp, index) => (
                    <div key={fp.name} className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs gap-3">
                      <span className="font-bold text-slate-800 text-sm whitespace-nowrap">{fp.name}</span>
                      <div className="flex items-center gap-2 w-full sm:w-auto">
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">全日薪</label>
                          <input 
                            type="number" 
                            value={fp.fullDayRate} 
                            onChange={(e) => updatePersonRate(index, 'fullDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">半日薪</label>
                          <input 
                            type="number" 
                            value={fp.halfDayRate} 
                            onChange={(e) => updatePersonRate(index, 'halfDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <button type="button" onClick={() => removePerson(fp.name)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer" title="移除">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={addPerson} className="pt-3 border-t border-slate-200">
                  <h4 className="text-[11px] font-bold text-slate-600 uppercase mb-3">新增班底</h4>
                  <div className="flex flex-col sm:flex-row gap-2.5 mb-3">
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">姓名</label>
                      <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="姓名" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">全日薪</label>
                      <input type="number" value={newFullRate} onChange={e => setNewFullRate(e.target.value)} placeholder="2500" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">半日薪</label>
                      <input type="number" value={newHalfRate} onChange={e => setNewHalfRate(e.target.value)} placeholder="1300" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">新增班底</button>
                </form>
              </Card>

              <Card title="手機 App 專用備份與還原">
                <div className="space-y-3">
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    在 WebIntoApp / Android App 中，推薦點擊**「儲存/分享 JSON 備份檔案」**，可直接存至手機檔案或傳送到 LINE／Google 雲端硬碟。
                  </p>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button type="button" onClick={exportDataFile} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap shadow-xs">
                      💾 儲存 / 分享 JSON 備份檔 (推薦)
                    </button>
                    <button type="button" onClick={exportDataText} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                      📋 複製備份文字代碼
                    </button>
                  </div>

                  <div className="pt-3 border-t border-slate-100 space-y-3">
                    <div className="space-y-1">
                      <label className="block text-[11px] font-bold text-slate-700">方式一：選擇備份檔案還原</label>
                      <input 
                        type="file" 
                        accept=".json" 
                        onChange={handleFileUpload} 
                        className="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                      />
                    </div>

                    <div className="space-y-1.5 pt-1">
                      <label className="block text-[11px] font-bold text-slate-700">方式二：貼上備份文字還原</label>
                      <textarea 
                        rows="3" 
                        value={importText} 
                        onChange={e => setImportText(e.target.value)} 
                        placeholder="在此貼上備份代碼文字..."
                        className="w-full p-2.5 text-xs border border-slate-200 rounded-xl outline-none font-mono"
                      ></textarea>
                      <button type="button" onClick={importDataText} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                        📥 執行文字還原
                      </button>
                    </div>
                  </div>
                </div>
              </Card>

            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
