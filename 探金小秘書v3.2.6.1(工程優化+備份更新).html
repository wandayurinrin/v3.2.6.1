<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // 安全剪貼簿複製相容函式
        const copyToClipboard = async (text) => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {
            console.warn('Clipboard API 失敗，嘗試相容模式...', err);
          }
          
          try {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) return true;
          } catch (err) {
            console.error('Fallback 複製失敗:', err);
          }
          return false;
        };

        const PERSONNEL_EXPENSE_OPTIONS = ['加班費', '獎金', '補貼油錢', '補貼餐費', '補貼房租', '其他'];

        const INITIAL_SETTINGS = {
          fixedPersonnel: [
            { name: '帥志', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿童', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿和', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿翔', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿孝', fullDayRate: 2500, halfDayRate: 1300 }
          ],
          companyName: '',
          taxId: '',
          phone: ''
        };

        const getDefaultBillingDate = (yearMonthStr) => {
          if (!yearMonthStr) return new Date().toISOString().split('T')[0];
          const [y, m] = yearMonthStr.split('-');
          let nextYear = parseInt(y, 10);
          let nextMonth = parseInt(m, 10) + 1;
          if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
          const mStr = String(nextMonth).padStart(2, '0');
          return `${nextYear}-${mStr}-05`;
        };

        const emptyRecordForm = () => {
          const defaultMonth = new Date().toISOString().slice(0, 7);
          return {
            id: null,
            type: 'contract', 
            projectName: '',
            workSections: [
              {
                id: generateId(),
                summary: '',
                tasks: []
              }
            ],
            workSummary: '', 
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '17:00',
            location: '',
            client: '',
            personnel: [],
            personnelExtras: [], 
            tasks: [],
            customItems: [], 
            images: [],
            manualBilling: '',
            billingDate: getDefaultBillingDate(defaultMonth),
            collectionDate: '',
            isCollected: false,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0 },
              food: { cost: 0, billable: false, billingAmount: 0 },
              drink: { cost: 0, billable: false, billingAmount: 0 },
              customCosts: []
            },
            remarks: ''
          };
        };

        const sanitizeRecord = (record) => {
          if (!record) return emptyRecordForm();
          
          let migratedExtras = Array.isArray(record.personnelExtras) ? [...record.personnelExtras] : [];
          let migratedPersonnel = [];

          (Array.isArray(record.personnel) ? record.personnel : []).forEach(p => {
             if (p.overtimePay > 0) migratedExtras.push({ id: generateId(), name: p.name, type: '加班費', amount: p.overtimePay, billable: p.billable });
             if (p.bonus > 0) migratedExtras.push({ id: generateId(), name: p.name, type: '獎金', amount: p.bonus, billable: p.billable });
             
             migratedPersonnel.push({
                 id: p.id, name: p.name, isFixed: p.isFixed, dayType: p.dayType || 'full', dailyRate: p.dailyRate, billable: p.billable
             });
          });

          const migratedTasks = (Array.isArray(record.tasks) ? record.tasks : []).map(t => ({
            ...t,
            laborCost: t.laborCost !== undefined ? t.laborCost : 0,
            otherCost: t.otherCost !== undefined ? t.otherCost : (t.materialCost !== undefined ? t.materialCost : 0)
          }));

          let workSections = [];
          if (Array.isArray(record.workSections) && record.workSections.length > 0) {
            workSections = record.workSections.map(sec => ({
              id: sec.id || generateId(),
              summary: sec.summary || '',
              tasks: Array.isArray(sec.tasks) ? sec.tasks.map(t => ({
                ...t,
                laborCost: t.laborCost !== undefined ? t.laborCost : 0,
                otherCost: t.otherCost !== undefined ? t.otherCost : (t.materialCost !== undefined ? t.materialCost : 0)
              })) : []
            }));
          } else {
            workSections = [{
              id: generateId(),
              summary: record.workSummary || '',
              tasks: migratedTasks
            }];
          }

          const drinkCost = record.costs?.drink || record.costs?.other || { cost: 0, billable: false, billingAmount: 0 };

          return {
            ...emptyRecordForm(),
            ...record,
            workSections,
            workSummary: record.workSummary || workSections.map(s => s.summary).filter(Boolean).join('； ') || '',
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.fuel || {}) },
              food: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.food || {}) },
              drink: { cost: 0, billable: false, billingAmount: 0, ...drinkCost },
              customCosts: Array.isArray(record.costs?.customCosts) ? record.costs.customCosts : []
            },
            personnel: migratedPersonnel,
            personnelExtras: migratedExtras,
            tasks: migratedTasks,
            customItems: Array.isArray(record.customItems) ? record.customItems : [],
            images: Array.isArray(record.images) ? record.images : []
          };
        };

        const TIME_OPTIONS = [];
        for (let h = 0; h < 24; h++) {
          const hourStr = String(h).padStart(2, '0');
          TIME_OPTIONS.push(`${hourStr}:00`);
          TIME_OPTIONS.push(`${hourStr}:30`);
        }

        // 優化照片壓縮：調小上限至 600px, 壓縮率 0.55，防範 APP 內儲存空間爆炸
        const resizeAndCompressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 600;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                width = MAX_SIZE;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.55));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const SoftIcon = ({ type, className = "w-5 h-5" }) => {
            const baseProps = { className, fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            switch(type) {
                case 'input': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>;
                case 'billing': return <svg {...baseProps} viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
                case 'salary': return <svg {...baseProps} viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
                case 'quotation': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>;
                case 'project': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>;
                case 'monthly': return <svg {...baseProps} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
                case 'stats': return <svg {...baseProps} viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
                case 'settings': return <svg {...baseProps} viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
                case 'edit': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
                case 'trash': return <svg {...baseProps} viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
                default: return null;
            }
        };

        const Card = ({ children, title, className = "", onClick }) => (
          <div className={`bg-white rounded-xl shadow-2xs border border-slate-200/80 overflow-hidden ${className}`} onClick={onClick}>
            {title && (
              <div className="px-4 py-3 border-b border-slate-100 bg-slate-50/70 flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-xs uppercase tracking-wider">{title}</h3>
              </div>
            )}
            <div className="p-3 sm:p-4">{children}</div>
          </div>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('input');
          const [editingRecord, setEditingRecord] = useState(null);
          
          const [zoomedImage, setZoomedImage] = useState(null);

          const [records, setRecords] = useState(() => {
            const saved = localStorage.getItem('engineering_records');
            return saved ? JSON.parse(saved) : [];
          });

          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('engineering_settings');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed.fixedPersonnel && typeof parsed.fixedPersonnel[0] === 'string') {
                parsed.fixedPersonnel = parsed.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
              }
              return { ...INITIAL_SETTINGS, ...parsed };
            }
            return INITIAL_SETTINGS;
          });
          
          const [toastMessage, setToastMessage] = useState('');
          const [deleteTarget, setDeleteTarget] = useState(null);
          
          const [officialInvoiceModal, setOfficialInvoiceModal] = useState(null);
          const [officialSalaryModal, setOfficialSalaryModal] = useState(null);
          const [officialQuotationModal, setOfficialQuotationModal] = useState(null);

          useEffect(() => {
            try {
                localStorage.setItem('engineering_records', JSON.stringify(records));
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    showToast('儲存空間已滿！請刪除舊資料或減少照片數量。');
                }
            }
          }, [records]);

          useEffect(() => {
            localStorage.setItem('engineering_settings', JSON.stringify(settings));
          }, [settings]);

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(''), 3000);
          };

          const handleSaveRecord = (recordData) => {
            if (recordData.id) {
              setRecords(prev => prev.map(r => r.id === recordData.id ? recordData : r));
              showToast('紀錄已更新！');
            } else {
              const newRecord = { ...recordData, id: generateId() };
              setRecords(prev => [newRecord, ...prev]);
              showToast('紀錄已儲存！');
            }
            setEditingRecord(null);
            setActiveTab(recordData.type === 'quotation' ? 'quotation' : 'monthly');
          };

          const handleStartEdit = (record) => {
            setEditingRecord(record);
            setActiveTab('input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const confirmDeleteRecord = () => {
            if (!deleteTarget) return;
            setRecords(prev => prev.filter(r => r.id !== deleteTarget));
            setToastMessage('紀錄已刪除');
            setDeleteTarget(null);
          };

          const updateSettings = (newSettings) => {
            setSettings(newSettings);
            showToast('設定已更新！');
          };

          const handleUpdateRecord = (updated) => {
            setRecords(prev => prev.map(r => r.id === updated.id ? updated : r));
          };

          const navItems = [
            { id: 'input', icon: <SoftIcon type="input" />, label: '新增' },
            { id: 'project', icon: <SoftIcon type="project" />, label: '工程' },
            { id: 'billing', icon: <SoftIcon type="billing" />, label: '請款' },
            { id: 'salary', icon: <SoftIcon type="salary" />, label: '薪資' },
            { id: 'quotation', icon: <SoftIcon type="quotation" />, label: '報價' },
            { id: 'monthly', icon: <SoftIcon type="monthly" />, label: '日報' },
            { id: 'stats', icon: <SoftIcon type="stats" />, label: '統計' },
            { id: 'settings', icon: <SoftIcon type="settings" />, label: '設定' }
          ];

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 font-sans relative pb-28 md:pb-10">
              
              {zoomedImage && (
                <div 
                  className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] flex items-center justify-center p-2 sm:p-6" 
                  onClick={() => setZoomedImage(null)}
                >
                    <button 
                      className="absolute top-4 right-4 sm:top-6 sm:right-6 text-white bg-black/50 hover:bg-black/80 rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold cursor-pointer transition-colors z-[101]" 
                      onClick={() => setZoomedImage(null)}
                    >
                      ✕
                    </button>
                    <img 
                      src={zoomedImage} 
                      className="max-w-full max-h-[90vh] object-contain rounded shadow-2xl scale-100 animate-[pulse_0.2s_ease-out_1]" 
                      onClick={(e) => e.stopPropagation()} 
                      alt="放大照片"
                    />
                </div>
              )}

              {toastMessage && (
                <div className="fixed top-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-lg shadow-lg z-[80] text-xs font-medium">
                  {toastMessage}
                </div>
              )}

              {deleteTarget && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-3xs flex items-center justify-center z-[70] p-4">
                  <div className="bg-white rounded-xl shadow-lg p-5 w-full max-w-xs border border-slate-200">
                    <h3 className="text-base font-bold text-slate-900 mb-1">確定要刪除？</h3>
                    <p className="text-xs text-slate-500 mb-4">此動作無法還原。</p>
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setDeleteTarget(null)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium cursor-pointer">取消</button>
                      <button onClick={confirmDeleteRecord} className="px-3 py-1.5 text-xs bg-rose-600 text-white hover:bg-rose-700 rounded-lg font-medium cursor-pointer">確定刪除</button>
                    </div>
                  </div>
                </div>
              )}

              {/* 請款單預覽 Modal */}
              {officialInvoiceModal && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex justify-center items-start z-[70] p-2 sm:p-4 pt-14 sm:pt-16 overflow-y-auto">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col border border-slate-200 overflow-hidden mb-6 h-fit shrink-0">
                    <div className="flex justify-between items-center px-3 py-2 bg-slate-900 text-white shrink-0 sticky top-0 z-10">
                      <h3 className="font-bold text-[11px] sm:text-xs">請款單預覽</h3>
                      <button onClick={() => setOfficialInvoiceModal(null)} className="text-slate-300 hover:text-white font-bold px-2 py-1 cursor-pointer">✕</button>
                    </div>

                    <div className="p-3 bg-white text-slate-800 space-y-2 text-[10px]">
                      <div className="text-center pb-2 border-b-2 border-slate-900">
                        <h2 className="text-base font-black text-slate-900 tracking-wider mb-0.5">{settings.companyName || '工程行'}</h2>
                        <div className="text-[9px] text-slate-600 font-medium space-x-2">
                          {settings.taxId && <span>統一編號：{settings.taxId}</span>}
                          {settings.phone && <span>電話：{settings.phone}</span>}
                        </div>
                        <h1 className="text-sm font-bold text-blue-700 mt-1.5 tracking-widest uppercase">請 款 單</h1>
                      </div>

                      <div className="flex justify-between items-start bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <div className="space-y-0.5">
                          <p><strong className="text-slate-500">客戶抬頭：</strong> <span className="font-bold text-slate-900 text-[11px]">{officialInvoiceModal.client}</span></p>
                          <p><strong className="text-slate-500">請款月份：</strong> <span className="font-mono font-bold text-slate-700">{officialInvoiceModal.month}</span></p>
                        </div>
                        <div className="text-right space-y-0.5">
                          <p><strong className="text-slate-500">填表日期：</strong> <span className="font-mono">{new Date().toISOString().slice(0, 10)}</span></p>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-center">
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">工費總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalLabor.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">料錢總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalMaterial.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">各項費用</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalExpenses.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">小計金額</span><span className="font-extrabold text-blue-600">${officialInvoiceModal.grandTotal.toLocaleString()}</span></div>
                      </div>

                      <div className="space-y-1">
                        <h4 className="font-bold text-slate-700 uppercase tracking-wider text-[10px]">工程明細列表</h4>
                        <div className="border border-slate-200 rounded-lg overflow-x-auto hide-scrollbar">
                          <table className="w-full min-w-full text-left border-collapse text-[9px] sm:text-[10px]">
                            <thead>
                              <tr className="bg-slate-900 text-white font-bold whitespace-nowrap">
                                <th className="px-2 py-1.5">日期</th>
                                <th className="px-2 py-1.5 w-full">工程/摘要</th>
                                <th className="px-2 py-1.5 text-center">人數</th>
                                <th className="px-2 py-1.5 text-right">工錢</th>
                                <th className="px-2 py-1.5 text-right">其他費</th>
                                <th className="px-2 py-1.5 text-right">總額</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {officialInvoiceModal.records.map((r, idx) => {
                                const pCount = (r.personnel || []).length;
                                let labor = 0;
                                (r.personnel || []).filter(p => p.billable).forEach(p => { labor += Number(p.dailyRate)||0; });
                                (r.personnelExtras || []).filter(pe => pe.billable).forEach(pe => { labor += Number(pe.amount)||0; });
                                (r.tasks || []).filter(t => t.billable).forEach(t => { labor += Number(t.laborCost)||0; });

                                let exp = 0;
                                ['fuel', 'food', 'drink'].forEach(k => { 
                                  if (r.costs?.[k]?.billable) exp += Number(r.costs?.[k]?.billingAmount) || 0; 
                                });
                                (r.costs?.customCosts || []).filter(c => c.billable).forEach(c => { exp += Number(c.billingAmount) || 0; });

                                const desc = r.workSummary || r.tasks?.[0]?.description || r.remarks || officialInvoiceModal.projectName;

                                return (

              <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 flex items-center justify-between px-1 py-1 z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.08)] print:hidden overflow-x-auto hide-scrollbar min-h-[56px]">
                {navItems.map(tab => (
                  <button 
                    key={tab.id}
                    onClick={() => { if(tab.id==='input') setEditingRecord(null); setActiveTab(tab.id); }} 
                    className={`flex flex-col items-center justify-center py-1 px-1 flex-1 min-w-[40px] rounded cursor-pointer transition-all ${activeTab === tab.id ? 'text-blue-600 font-bold scale-105' : 'text-slate-400 font-medium hover:text-slate-600'}`}
                  >
                    <span className="flex items-center justify-center mb-0.5">{React.cloneElement(tab.icon, { className: "w-4 h-4" })}</span>
                    <span className="text-[9px] leading-tight whitespace-nowrap">{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        function InputView({ onSave, settings, initialData, onCancelEdit, showToast, records = [] }) {
          const [formData, setFormData] = useState(() => sanitizeRecord(initialData));

          const historyProjects = useMemo(() => {
            if (!records || records.length === 0) return [];
            const map = new Map();
            const sorted = [...records].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            sorted.forEach(r => {
              if (r.type === 'holiday' || r.projectName === '休假') return;
              if (r.projectName && r.projectName.trim()) {
                const name = r.projectName.trim();
                if (!map.has(name)) {
                  map.set(name, {
                    projectName: name,
                    client: r.client || '',
                    location: r.location || '',
                    type: r.type
                  });
                }
              }
            });
            return Array.from(map.values());
          }, [records]);

          useEffect(() => {
            setFormData(sanitizeRecord(initialData));
          }, [initialData]);

          const handleInputChange = (field, value) => {
            setFormData(prev => {
              const updated = { ...prev, [field]: value };
              if (field === 'date' && value) {
                const ym = value.slice(0, 7);
                updated.billingDate = getDefaultBillingDate(ym);
              }
              return updated;
            });
          };
          
          const handleCostDetailChange = (costKey, field, value) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                [costKey]: {
                  ...prev.costs[costKey],
                  [field]: field === 'billable' ? value : (Number(value) || 0)
                }
              }
            }));
          };

          const addCustomCost = () => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                customCosts: [...(prev.costs.customCosts || []), { id: generateId(), name: '', cost: 0, billable: false, billingAmount: 0 }]
              }
            }));
          };

          const updateCustomCost = (id, field, value) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                customCosts: (prev.costs.customCosts || []).map(c => 
                  c.id === id ? { ...c, [field]: field === 'name' ? value : field === 'billable' ? value : (Number(value) || 0) } : c
                )
              }
            }));
          };

          const removeCustomCost = (id) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                customCosts: (prev.costs.customCosts || []).filter(c => c.id !== id)
              }
            }));
          };

          const addFixedPersonnel = (fp) => {
            const isAlreadyAdded = formData.personnel.some(p => p.name === fp.name);
            if (isAlreadyAdded) {
              setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.name !== fp.name) }));
            } else {
              setFormData(prev => ({ 
                ...prev, 
                personnel: [...prev.personnel, { id: generateId(), name: fp.name, isFixed: true, dayType: 'full', dailyRate: fp.fullDayRate || 2500, billable: false }] 
              }));
            }
          };

          const addPersonnel = (isFixed, name = '') => setFormData(prev => ({ 
            ...prev, 
            personnel: [...prev.personnel, { id: generateId(), name, isFixed, dayType: 'full', dailyRate: 2500, billable: false }] 
          }));

          const updatePersonnel = (id, field, value) => {
            setFormData(prev => ({ 
              ...prev, 
              personnel: prev.personnel.map(p => {
                if (p.id !== id) return p;
                let updated = { ...p };
                if (field === 'dayType') {
                  updated.dayType = value;
                  if (value === 'outsource') {
                    updated.dailyRate = 0;
                  } else {
                    const matchedFp = settings.fixedPersonnel.find(fp => fp.name === p.name);
                    if (matchedFp) {
                      updated.dailyRate = value === 'full' ? matchedFp.fullDayRate : matchedFp.halfDayRate;
                    } else {
                      updated.dailyRate = value === 'full' ? 2500 : 1300;
                    }
                  }
                } else if (field === 'name' || field === 'billable') {
                  updated[field] = value;
                } else {
                  updated[field] = Number(value) || 0;
                }
                return updated;
              }) 
            }));
          };

          const removePersonnel = (id) => setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.id !== id) }));

          const addPersonnelExtra = () => {
             const defaultName = formData.personnel.length > 0 ? formData.personnel[0].name : '';
             setFormData(prev => ({
                ...prev,
                personnelExtras: [...prev.personnelExtras, { id: generateId(), name: defaultName, type: '加班費', amount: 0, billable: false }]
             }));
          };
          const updatePersonnelExtra = (id, field, value) => {
             setFormData(prev => ({
                 ...prev,
                 personnelExtras: prev.personnelExtras.map(pe => pe.id === id ? { ...pe, [field]: field === 'amount' ? (Number(value)||0) : value } : pe)
             }));
          };
          const removePersonnelExtra = (id) => setFormData(prev => ({ ...prev, personnelExtras: prev.personnelExtras.filter(pe => pe.id !== id) }));

          const addWorkSection = () => {
            setFormData(prev => ({
              ...prev,
              workSections: [
                ...prev.workSections,
                { id: generateId(), summary: '', tasks: [] }
              ]
            }));
          };

          const updateWorkSectionSummary = (sectionId, summary) => {
            setFormData(prev => ({
              ...prev,
              workSections: prev.workSections.map(s => s.id === sectionId ? { ...s, summary } : s)
            }));
          };

          const removeWorkSection = (sectionId) => {
            setFormData(prev => {
              if (prev.workSections.length <= 1) {
                return {
                  ...prev,
                  workSections: [{ id: generateId(), summary: '', tasks: [] }]
                };
              }
              return {
                ...prev,
                workSections: prev.workSections.filter(s => s.id !== sectionId)
              };
            });
          };

          const addTaskToSection = (sectionId) => {
            setFormData(prev => ({
              ...prev,
              workSections: prev.workSections.map(s => {
                if (s.id !== sectionId) return s;
                return {
                  ...s,
                  tasks: [...s.tasks, { id: generateId(), description: '', laborCost: 0, otherCost: 0, billingAmount: 0, billable: false }]
                };
              })
            }));
          };

          const updateTaskInSection = (sectionId, taskId, field, value) => {
            setFormData(prev => ({
              ...prev,
              workSections: prev.workSections.map(s => {
                if (s.id !== sectionId) return s;
                return {
                  ...s,
                  tasks: s.tasks.map(t => t.id === taskId ? { ...t, [field]: field === 'description' || field === 'billable' ? value : (Number(value) || 0) } : t)
                };
              })
            }));
          };

          const removeTaskFromSection = (sectionId, taskId) => {
            setFormData(prev => ({
              ...prev,
              workSections: prev.workSections.map(s => {
                if (s.id !== sectionId) return s;
                return {
                  ...s,
                  tasks: s.tasks.filter(t => t.id !== taskId)
                };
              })
            }));
          };

          const addCustomItem = () => setFormData(prev => ({
            ...prev,
            customItems: [...prev.customItems, { id: generateId(), name: '', qty: 1, price: 0, billable: false }]
          }));
          const updateCustomItem = (id, field, value) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.map(c => c.id === id ? { ...c, [field]: field === 'name' || field === 'billable' ? value : (Number(value) || 0) } : c)
          }));
          const removeCustomItem = (id) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.filter(c => c.id !== id)
          }));

          const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            if (formData.images.length + files.length > 9) {
               showToast('每筆紀錄最多只能上傳 9 張照片！');
               files.splice(9 - formData.images.length);
            }
            
            showToast('照片壓縮處理中...');

            try {
                const compressedImages = await Promise.all(files.map(file => resizeAndCompressImage(file)));
                setFormData(prev => ({
                    ...prev,
                    images: [...prev.images, ...compressedImages].slice(0, 9)
                }));
            } catch (error) {
                showToast('圖片處理失敗，請換一張試試');
            }
            
            e.target.value = '';
          };

          const removeImage = (indexToRemove) => {
              setFormData(prev => ({
                  ...prev,
                  images: prev.images.filter((_, idx) => idx !== indexToRemove)
              }));
          };

          const allTasks = useMemo(() => {
            return formData.workSections.flatMap(s => s.tasks);
          }, [formData.workSections]);

          const autoBillingSum = useMemo(() => {
            let sum = 0;
            formData.personnel.forEach(p => { if (p.billable) sum += (Number(p.dailyRate) || 0); });
            formData.personnelExtras.forEach(pe => { if (pe.billable) sum += (Number(pe.amount) || 0); });
            allTasks.forEach(t => { if (t.billable) sum += Number(t.billingAmount) || 0; });
            formData.customItems.forEach(c => { if (c.billable) sum += (Number(c.qty) || 0) * (Number(c.price) || 0); });
            
            ['fuel', 'food', 'drink'].forEach(key => {
              const c = formData.costs[key];
              if (c && c.billable) sum += Number(c.billingAmount) || 0;
            });

            (formData.costs?.customCosts || []).forEach(cc => {
              if (cc.billable) sum += Number(cc.billingAmount) || 0;
            });

            return sum;
          }, [formData.personnel, formData.personnelExtras, allTasks, formData.customItems, formData.costs]);

          const totalBilling = formData.manualBilling !== '' && formData.manualBilling !== null && formData.manualBilling !== undefined ? Number(formData.manualBilling) : autoBillingSum;

          const tasksTotalCost = useMemo(() => {
            return allTasks.reduce((sum, t) => sum + (Number(t.laborCost) || 0) + (Number(t.otherCost) || 0), 0);
          }, [allTasks]);

          const tasksTotalBilling = useMemo(() => {
            return allTasks.reduce((sum, t) => sum + (t.billable ? (Number(t.billingAmount) || 0) : 0), 0);
          }, [allTasks]);

          const summary = useMemo(() => {
            if (formData.type === 'holiday') return { totalCost: 0, totalBilling: 0, profit: 0 };
            const personnelCost = formData.personnel.reduce((sum, p) => sum + (Number(p.dailyRate) || 0), 0);
            const extrasCost = formData.personnelExtras.reduce((sum, pe) => sum + (Number(pe.amount) || 0), 0);
            const taskCost = tasksTotalCost;
            const customItemsCost = formData.customItems.reduce((sum, c) => sum + ((Number(c.qty) || 0) * (Number(c.price) || 0)), 0);
            const standardOtherCosts = (Number(formData.costs?.fuel?.cost) || 0) + (Number(formData.costs?.food?.cost) || 0) + (Number(formData.costs?.drink?.cost) || 0);
            const customOtherCosts = (formData.costs?.customCosts || []).reduce((sum, cc) => sum + (Number(cc.cost) || 0), 0);
            
            const totalCost = personnelCost + extrasCost + taskCost + customItemsCost + standardOtherCosts + customOtherCosts;
            return { totalCost, totalBilling, profit: totalBilling - totalCost };
          }, [formData, totalBilling, tasksTotalCost]);

          const handleSubmit = (e) => {
            e.preventDefault();
            if (formData.type === 'holiday') {
              if (!formData.date) { alert('請填寫日期'); return; }
              const finalRecord = { 
                ...formData, 
                projectName: '休假', 
                client: '無', 
                summary: { totalCost: 0, totalBilling: 0, profit: 0 }, 
                personnel: [], 
                personnelExtras: [], 
                tasks: [], 
                customItems: [] 
              };
              onSave(finalRecord);
              return;
            }

            if (!formData.projectName || !formData.date || !formData.client) {
              alert('請至少填寫工程名稱、日期與請款對象。');
              return;
            }

            const combinedWorkSummary = formData.workSections.map(s => s.summary).filter(Boolean).join('； ');
            const finalRecord = { 
              ...formData, 
              workSummary: combinedWorkSummary,
              tasks: allTasks,
              manualBilling: totalBilling, 
              summary 
            };
            onSave(finalRecord);
          };

          const isHoliday = formData.type === 'holiday';

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              {initialData && (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg flex justify-between items-center text-xs">
                  <span>正在編輯：<strong>{initialData.projectName}</strong></span>
                  <button type="button" onClick={onCancelEdit} className="bg-amber-200 px-2.5 py-1 rounded font-semibold cursor-pointer">取消</button>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <Card title="基本資訊">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div className="col-span-full">
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">紀錄分類</label>
                      <div className="flex flex-wrap gap-4 text-xs">
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="contract" checked={formData.type === 'contract'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>發包</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="hourly" checked={formData.type === 'hourly'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>計工時</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="quotation" checked={formData.type === 'quotation'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-amber-600" />
                          <span className="font-bold text-amber-600">報價</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="holiday" checked={formData.type === 'holiday'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-rose-500" />
                          <span className="font-bold text-rose-500">⛱️ 休假</span>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">日期 *</label>
                      <input type="date" value={formData.date} onChange={(e) => handleInputChange('date', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required />
                    </div>

                    {!isHoliday && (
                      <>
                        <div>
                          <div className="flex justify-between items-center mb-1">
                            <label className="block text-[11px] font-bold text-slate-500 uppercase">工程名稱 *</label>
                            {formData.type === 'contract' && historyProjects.length > 0 && (
                              <span className="text-[10px] text-blue-600 font-bold">歷史紀錄套用</span>
                            )}
                          </div>
                          {formData.type === 'contract' && historyProjects.length > 0 && (
                            <select
                              className="w-full p-2 mb-1.5 text-xs border border-blue-200 rounded-lg outline-none bg-blue-50/60 font-medium text-slate-800 cursor-pointer"
                              onChange={(e) => {
                                const val = e.target.value;
                                if (!val) return;
                                const found = historyProjects.find(p => p.projectName === val);
                                if (found) {
                                  setFormData(prev => ({
                                    ...prev,
                                    projectName: found.projectName,
                                    client: found.client || prev.client,
                                    location: found.location || prev.location
                                  }));
                                  if (showToast) showToast(`已自動套用：${found.projectName}`);
                                }
                              }}
                              defaultValue=""
                            >
                              <option value="" disabled>-選擇歷史工程-</option>
                              {historyProjects.map(p => (
                                <option key={p.projectName} value={p.projectName}>
                                  {p.projectName}
                                </option>
                              ))}
                            </select>
                          )}
                          <input type="text" value={formData.projectName} onChange={(e) => handleInputChange('projectName', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="工程名稱" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">請款對象 *</label>
                          <input type="text" value={formData.client} onChange={(e) => handleInputChange('client', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="客戶" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">地點</label>
                          <input type="text" value={formData.location} onChange={(e) => handleInputChange('location', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="地點" />
                        </div>
                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">開始時間</label>
                            <select value={formData.startTime} onChange={(e) => handleInputChange('startTime', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg bg-white outline-none font-mono">
                              {TIME_OPTIONS.map(time => <option key={time} value={time}>{time}</option>)}
                            </select>
                          </div>
                          <div className="flex-1">
                            <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">結束時間</label>
                            <select value={formData.endTime} onChange={(e) => handleInputChange('endTime', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg bg-white outline-none font-mono">
                              {TIME_OPTIONS.map(time => <option key={time} value={time}>{time}</option>)}
                            </select>
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                </Card>

                {!isHoliday && (
                  <>
                    <Card title="參與人員">
                      <div className="mb-2.5 flex flex-nowrap items-center gap-1 overflow-x-auto hide-scrollbar pb-0.5">
                        <span className="text-[11px] font-bold text-slate-400 mr-1 shrink-0">人員：</span>
                        {settings.fixedPersonnel.map(fp => {
                          const isAdded = formData.personnel.some(p => p.name === fp.name);
                          return (
                            <button type="button" key={fp.name} onClick={() => addFixedPersonnel(fp)} className={`px-2 py-1 rounded text-[11px] font-semibold border cursor-pointer shrink-0 whitespace-nowrap ${isAdded ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'}`}>
                              {isAdded ? '✓ ' : '+ '}{fp.name}
                            </button>
                          );
                        })}
                        <button type="button" onClick={() => addPersonnel(false, '')} className="px-2 py-1 rounded text-[11px] font-semibold border bg-emerald-50 border-emerald-200 text-emerald-700 cursor-pointer shrink-0 whitespace-nowrap">+ 臨時工</button>
                      </div>

                      <div className="space-y-2 max-w-full overflow-hidden">
                        {formData.personnel.map(p => (
                          <div key={p.id} className="flex flex-nowrap items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200 overflow-x-auto hide-scrollbar w-full">
                            <label className="flex items-center gap-1 text-[11px] font-bold text-blue-700 cursor-pointer shrink-0">
                                <input type="checkbox" checked={p.billable === true} onChange={(e) => updatePersonnel(p.id, 'billable', e.target.checked)} className="w-3.5 h-3.5 text-blue-600 rounded cursor-pointer" />
                                <span>請款</span>
                            </label>
                            <input type="text" value={p.name} onChange={(e) => updatePersonnel(p.id, 'name', e.target.value)} className="w-20 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-xs font-bold outline-none" placeholder="姓名" />
                            <select value={p.dayType || 'full'} onChange={(e) => updatePersonnel(p.id, 'dayType', e.target.value)} className="w-20 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-[11px] font-semibold cursor-pointer outline-none text-center">
                                <option value="full">全日</option>
                                <option value="half">半日</option>
                                <option value="outsource">發包</option>
                            </select>
                            <div className="flex items-center gap-1 shrink-0 w-24">
                                <span className="text-[10px] text-slate-500 font-bold">金額</span>
                                <input type="number" value={p.dailyRate !== undefined && p.dailyRate !== null ? p.dailyRate : ''} onChange={(e) => updatePersonnel(p.id, 'dailyRate', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded bg-white font-bold text-xs text-right outline-none" placeholder="0" />
                            </div>
                            <button type="button" onClick={() => removePersonnel(p.id)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer shrink-0 ml-auto" title="刪除">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                          </div>
                        ))}
                        {formData.personnel.length === 0 && <p className="text-[11px] text-slate-400 text-center py-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 font-medium">尚未加入人員</p>}
                      </div>
                    </Card>

                    <Card title="其他人事費 (加班/獎金/補貼等)">
                      <div className="space-y-2 max-w-full overflow-hidden">
                        {formData.personnelExtras.map(pe => {
                           const isCustomType = !PERSONNEL_EXPENSE_OPTIONS.includes(pe.type) && pe.type !== '';
                           return (
                             <div key={pe.id} className="flex flex-nowrap items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200 overflow-x-auto hide-scrollbar w-full">
                               <label className="flex items-center gap-1 text-[11px] font-bold text-blue-700 cursor-pointer shrink-0">
                                   <input type="checkbox" checked={pe.billable === true} onChange={(e) => updatePersonnelExtra(pe.id, 'billable', e.target.checked)} className="w-3.5 h-3.5 text-blue-600 rounded cursor-pointer" />

                     <div className="grid grid-cols-3 gap-4 w-full sm:w-auto text-center sm:text-left text-xs">
                       <div><p className="text-slate-400 text-[10px] font-medium whitespace-nowrap">預估成本</p><p className="text-sm font-bold text-rose-400 whitespace-nowrap">${summary.totalCost.toLocaleString()}</p></div>
                       <div><p className="text-slate-400 text-[10px] font-medium whitespace-nowrap">最終請款</p><p className="text-sm font-bold text-emerald-400 whitespace-nowrap">${summary.totalBilling.toLocaleString()}</p></div>
                       <div><p className="text-slate-400 text-[10px] font-medium whitespace-nowrap">預估毛利</p><p className="text-sm font-bold text-white whitespace-nowrap">${summary.profit.toLocaleString()}</p></div>

                   <div className="flex gap-2 w-full sm:w-auto">

                       <button type="button" onClick={onCancelEdit} className="flex-1 sm:flex-initial px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-lg cursor-pointer">取消</button>
                     )}
                     <button type="submit" className="flex-1 sm:flex-initial px-6 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-lg cursor-pointer shadow-sm">

        }

        function ProjectView({ records, onEdit, onDelete, setZoomedImage }) {
          const [selectedType, setSelectedType] = useState('all');
          const [searchTerm, setSearchTerm] = useState('');
          const [expandedProjects, setExpandedProjects] = useState({});
          const [expandedDetails, setExpandedDetails] = useState({});

          const validRecords = useMemo(() => {
            return records.filter(r => r.type !== 'quotation' && r.type !== 'holiday' && r.projectName);
          }, [records]);

          const projectGroups = useMemo(() => {
            const map = {};
            validRecords.forEach(r => {
              const name = r.projectName.trim();
              if (!map[name]) {
                map[name] = {
                  projectName: name,
                  type: r.type,
                  client: r.client || '未填寫客戶',
                  records: [],
                  laborCostSum: 0,
                  laborBillingSum: 0,
                  materialCostSum: 0,
                  materialBillingSum: 0,
                  otherCostSum: 0,
                  otherBillingSum: 0,
                  totalCost: 0,
                  totalBilling: 0,
                  dates: new Set(),
                  personnelStats: {},
                  customItemsAll: [],
                  costsAll: []
                };
              }
              const pGroup = map[name];
              pGroup.records.push(r);
              pGroup.dates.add(r.date);

              const cCost = r.summary?.totalCost || 0;
              const cBilling = r.summary?.totalBilling || 0;

              pGroup.totalCost += cCost;
              pGroup.totalBilling += cBilling;

              let rLaborCost = 0;
              let rLaborBilling = 0;
              (r.personnel || []).forEach(p => {
                const rate = Number(p.dailyRate) || 0;
                rLaborCost += rate;
                if (p.billable) rLaborBilling += rate;
                if (p.name) {
                  const dayVal = p.dayType === 'half' ? 0.5 : p.dayType === 'outsource' ? 1.0 : 1.0;
                  pGroup.personnelStats[p.name] = (pGroup.personnelStats[p.name] || 0) + dayVal;
                }
              });
              (r.personnelExtras || []).forEach(pe => { 
                const amt = Number(pe.amount) || 0;
                rLaborCost += amt;
                if (pe.billable) rLaborBilling += amt;
              });
              const tasks = Array.isArray(r.workSections) ? r.workSections.flatMap(s => s.tasks) : (r.tasks || []);
              tasks.forEach(t => { 
                rLaborCost += Number(t.laborCost) || 0; 
                if (t.billable) rLaborBilling += Number(t.billingAmount) || 0;
              });
              pGroup.laborCostSum += rLaborCost;
              pGroup.laborBillingSum += rLaborBilling;

              let rMatCost = 0;
              let rMatBilling = 0;
              (r.customItems || []).forEach(c => {
                const itemTotal = (Number(c.qty) || 0) * (Number(c.price) || 0);
                rMatCost += itemTotal;
                if (c.billable) rMatBilling += itemTotal;
                pGroup.customItemsAll.push({ ...c, date: r.date });
              });
              tasks.forEach(t => { rMatCost += Number(t.otherCost || t.materialCost) || 0; });
              pGroup.materialCostSum += rMatCost;
              pGroup.materialBillingSum += rMatBilling;

              let rOtherCost = (Number(r.costs?.fuel?.cost) || 0) + (Number(r.costs?.food?.cost) || 0) + (Number(r.costs?.drink?.cost) || 0);
              let rOtherBilling = 0;
              ['fuel', 'food', 'drink'].forEach(k => {
                if (r.costs?.[k]?.cost > 0) {
                  const labels = { fuel: '加油錢', food: '餐費', drink: '飲料' };
                  pGroup.costsAll.push({ date: r.date, name: labels[k], cost: r.costs[k].cost, billable: r.costs[k].billable });
                }
                if (r.costs?.[k]?.billable) {
                  rOtherBilling += Number(r.costs[k].billingAmount) || 0;
                }
              });
              (r.costs?.customCosts || []).forEach(cc => {
                if (cc.cost > 0) {
                  rOtherCost += Number(cc.cost) || 0;
                  pGroup.costsAll.push({ date: r.date, name: cc.name || '其他費用', cost: cc.cost, billable: cc.billable });
                }
                if (cc.billable) {
                  rOtherBilling += Number(cc.billingAmount) || 0;
                }
              });
              pGroup.otherCostSum += rOtherCost;
              pGroup.otherBillingSum += rOtherBilling;
            });

            Object.values(map).forEach(group => {
              group.records.sort((a, b) => a.date.localeCompare(b.date));
              group.dateRange = group.records.length > 0 
                ? `${group.records[0].date} ~ ${group.records[group.records.length - 1].date}`
                : '';
              group.workDaysCount = group.dates.size;
              group.profit = group.totalBilling - group.totalCost;
              group.margin = group.totalBilling > 0 ? ((group.profit / group.totalBilling) * 100).toFixed(1) : '0.0';
            });

            return Object.values(map);
          }, [validRecords]);

          const filteredProjects = useMemo(() => {
            return projectGroups.filter(p => {
              if (selectedType !== 'all' && p.type !== selectedType) return false;
              if (searchTerm.trim()) {
                const term = searchTerm.trim().toLowerCase();
                return p.projectName.toLowerCase().includes(term) || p.client.toLowerCase().includes(term);

              return true;

          const toggleExpand = (pName) => {
            setExpandedProjects(prev => ({ ...prev, [pName]: !prev[pName] }));

          const toggleDetailExpand = (pName, e) => {

                    >
                      📦 發包工程 ({projectGroups.filter(p => p.type === 'contract').length})

                    <button 
                      onClick={() => setSelectedType('hourly')} 
                      className={`flex-1 sm:flex-initial px-3 py-1.5 rounded-md transition-colors cursor-pointer ${selectedType === 'hourly' ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-500 hover:text-slate-800'}`}
                    >
                      ⏱️ 計工時 ({projectGroups.filter(p => p.type === 'hourly').length})
                    </button>
                  </div>

                  <input 
                    type="text" 
                    value={searchTerm} 
                    onChange={e => setSearchTerm(e.target.value)}

                    className="p-1.5 px-3 border border-slate-200 rounded-lg text-xs bg-slate-50 outline-none w-full sm:w-48"

                      </div>

                      {isExpanded && (

                          <div className="bg-white p-2.5 rounded-lg border border-slate-200/80 space-y-1.5">

                            <div className="flex flex-nowrap gap-1 pt-1 overflow-x-auto hide-scrollbar">
                              {Object.entries(proj.personnelStats).map(([pName, days]) => (
                                <div key={pName} className="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-slate-800 font-bold text-[10px] whitespace-nowrap shrink-0">
                                  {pName}：<span className="text-blue-600">{days} 天</span>

                              {Object.keys(proj.personnelStats).length === 0 && <span className="text-slate-400 text-[10px]">尚無人員紀錄</span>}

                          <div className="bg-white p-2.5 rounded-lg border border-slate-200/80 space-y-2">

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-center">

                                  ${proj.laborCostSum.toLocaleString()} / <span className="text-blue-600">${proj.laborBillingSum.toLocaleString()}</span>

                                  ${proj.otherCostSum.toLocaleString()} / <span className="text-amber-700">${proj.otherBillingSum.toLocaleString()}</span>
                                </span>

                              <div className="bg-slate-900 text-white py-1.5 px-1.5 rounded-lg border border-slate-800 flex flex-col justify-center">
                                <span className="text-slate-300 block font-bold text-[9px] mb-0.5">總計成本 / 請款</span>

                                  ${proj.totalCost.toLocaleString()} / ${proj.totalBilling.toLocaleString()}

                                          return (

        function BillingView({ records, settings, onUpdateRecord, setOfficialInvoiceModal, showToast }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedClient, setSelectedClient] = useState('全部');
          const [expandedProjects, setExpandedProjects] = useState({});

          const validRecords = useMemo(() => records.filter(r => r.type !== 'quotation' && r.type !== 'holiday'), [records]);
          
          const clients = useMemo(() => {
            const list = Array.from(new Set(validRecords.filter(r => r.date && r.date.startsWith(selectedMonth)).map(r => r.client)));
            return ['全部', ...list];
          }, [validRecords, selectedMonth]);

          useEffect(() => { 
            if (!clients.includes(selectedClient)) setSelectedClient('全部'); 
          }, [clients, selectedClient]);

          const clientRecords = useMemo(() => {
            return validRecords.filter(r => {
              if (!r.date || !r.date.startsWith(selectedMonth)) return false;
              if (selectedClient === '全部') return true;
              return r.client === selectedClient;
            });
          }, [validRecords, selectedMonth, selectedClient]);
          
          const groupedByProject = useMemo(() => {
            const map = {};
            clientRecords.forEach(r => {
              const pName = r.projectName || '未命名工程';
              const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
              
              if (!map[clientKey]) {
                map[clientKey] = {
                  projectName: pName,
                  client: r.client || '散客',
                  records: [],
                  totalLabor: 0,
                  totalMaterial: 0,
                  totalExpenses: 0,
                  grandTotalBilling: 0,
                  isCollected: r.isCollected
                };
              }
              map[clientKey].records.push(r);
              
              let laborBilling = 0;
              (r.personnel || []).filter(p => p.billable).forEach(p => { laborBilling += (Number(p.dailyRate) || 0); });
              (r.personnelExtras || []).filter(pe => pe.billable).forEach(pe => { laborBilling += (Number(pe.amount) || 0); });
              const tasks = Array.isArray(r.workSections) ? r.workSections.flatMap(s => s.tasks) : (r.tasks || []);
              tasks.filter(t => t.billable).forEach(t => { laborBilling += (Number(t.billingAmount) || 0); });
              map[clientKey].totalLabor += laborBilling;

              let materialBilling = 0;
              (r.customItems || []).filter(c => c.billable).forEach(c => { materialBilling += (Number(c.qty) || 0) * (Number(c.price) || 0); });
              map[clientKey].totalMaterial += materialBilling;

              let expBilling = 0;
              ['fuel', 'food', 'drink'].forEach(k => {
                if (r.costs?.[k]?.billable) {
                  expBilling += Number(r.costs?.[k]?.billingAmount) || 0;
                }
              });
              (r.costs?.customCosts || []).filter(cc => cc.billable).forEach(cc => {
                expBilling += Number(cc.billingAmount) || 0;
              });
              map[clientKey].totalExpenses += expBilling;

              map[clientKey].grandTotalBilling += r.summary?.totalBilling || 0;
            });
            return Object.values(map);
          }, [clientRecords, selectedClient]);

          const overallGrandTotal = groupedByProject.reduce((sum, item) => sum + item.grandTotalBilling, 0);

          const toggleExpand = (key) => {
            setExpandedProjects(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const toggleProjectCollected = (proj, e) => {
            e.stopPropagation();
            const nextStatus = !proj.isCollected;
            proj.records.forEach(r => {
              const updated = { ...r, isCollected: nextStatus, collectionDate: nextStatus ? new Date().toISOString().slice(0, 10) : '' };
              onUpdateRecord(updated);
            });
          };

          return (

                    <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 mb-1">{settings.companyName || '工程請款單'}</h2>
                    {settings.taxId && <p className="text-[11px] text-slate-500 font-medium">統編：{settings.taxId} | 電話：{settings.phone}</p>}
                    <div className="flex justify-between items-center text-xs font-bold text-slate-700 mt-3 px-1">

                  <div className="space-y-3">

                    {groupedByProject.map((proj, pIdx) => {
                      const isExpanded = expandedProjects[pIdx];
                      return (
                        <div key={pIdx} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/40 transition-all">
                          <div 
                            onClick={() => toggleExpand(pIdx)}
                            className="p-3 flex justify-between items-center gap-2 bg-white cursor-pointer active:bg-slate-50 md:hover:bg-slate-50 select-none min-h-[58px]"

                                <h4 className="font-bold text-xs sm:text-sm text-slate-900 truncate">{proj.projectName}</h4>

                              </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">

                                    type="checkbox"

                              <div className="text-right"><span className="text-slate-400 block font-bold text-[9px]">工費總額</span><span className="font-extrabold text-slate-800 text-xs">${proj.totalLabor.toLocaleString()}</span></div>
                              <div className="text-right"><span className="text-slate-400 block font-bold text-[9px]">物料總額</span><span className="font-extrabold text-slate-800 text-xs">${proj.totalMaterial.toLocaleString()}</span></div>
                              <div className="text-right"><span className="text-slate-400 block font-bold text-[9px]">其他費用</span><span className="font-extrabold text-slate-800 text-xs">${proj.totalExpenses.toLocaleString()}</span></div>
                              <div className="text-right"><span className="text-slate-400 block font-bold text-[9px]">總計</span><span className="font-extrabold text-emerald-600 text-xs">${proj.grandTotalBilling.toLocaleString()}</span></div>
                            </div>

                            <div className="bg-white rounded-lg border border-slate-200 p-2 space-y-1.5">
                              <h5 className="text-[11px] font-bold text-slate-700 border-b pb-1">每日工作摘要</h5>
                              <div className="w-full">
                                <table className="w-full table-fixed text-left border-collapse text-[9px] sm:text-[10px] bg-white whitespace-nowrap">
                                  <thead>
                                    <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                      <th className="px-1 py-1.5 w-[19%] text-left">日期</th>
